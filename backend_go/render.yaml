services:
  - type: web
    name: gestory-backend
    runtime: go
    rootDir: backend_go
    buildCommand: go build -o bin/api ./cmd/api/main.go
    startCommand: ./bin/api
    envVars:
      - key: APP_ENV
        value: production
      - key: PORT
        value: 8000
      - key: FRONTEND_URL
        sync: false   # set manually in Render dashboard
      - key: DATABASE_URL
        sync: false   # set manually in Render dashboard
      - key: SUPABASE_JWT_SECRET
        sync: false   # set manually in Render dashboard
      - key: SUPABASE_JWKS_URL
        sync: false   # set manually in Render dashboard
    healthCheckPath: /api/v1/health
